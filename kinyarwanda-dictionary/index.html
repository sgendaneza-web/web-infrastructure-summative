<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kinyarwanda-English Dictionary</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Murakaza neza! Welcome!</h1>
    <p class="subtitle">Whether you're learning Kinyarwanda or looking up an English word, search below to see translations.</p>

    <div class="search-box">
      <select id="direction">
        <option value="en|rw">English → Kinyarwanda</option>
        <option value="rw|en">Kinyarwanda → English</option>
      </select>
      <input type="text" id="searchInput" placeholder="Type a word or phrase...">
      <button id="searchBtn">Search</button>
    </div>

    <div id="result" class="result"></div>
    <div id="examples" class="examples"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
